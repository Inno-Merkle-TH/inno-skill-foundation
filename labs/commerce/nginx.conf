server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s;
    location = /lab-events {
        set $api http://qe-api:3000;
        proxy_pass $api;
        client_max_body_size 64k;
    }
    location /lab-api/ {
        set $api http://qe-api:3000;
        proxy_pass $api;
    }
    location ~* ^/(wp-admin(?:/|$)|wp-login\.php|xmlrpc\.php|wp-json/wp/v2/users) { return 403; }
    location ~* [\?&]rest_route= { return 403; }
    location / {
        if ($arg_rest_route != '') { return 403; }
        set $store http://wordpress:80;
        proxy_pass $store;
        proxy_set_header Host $http_host;
        proxy_set_header X-QE-Local-Admin '';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 81;
    server_name _;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $store http://wordpress:80;
        proxy_pass $store;
        proxy_set_header Host $http_host;
        proxy_set_header X-QE-Local-Admin '1';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
