services:
  restoredb:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: commerce
      MARIADB_USER: commerce
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - restore_database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  restorefiles:
    image: wordpress:cli-2.12.0-php8.3
    user: '0:0'
    volumes:
      - restore_content:/restore
    entrypoint: [sh, -c, 'tar -xzf - -C /restore']
  restoreapp:
    image: wordpress:7.1.3-php8.3-apache
    environment: &restore-environment
      WORDPRESS_DB_HOST: restoredb
      WORDPRESS_DB_USER: commerce
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: commerce
    volumes:
      - restore_content:/var/www/html
    depends_on:
      restoredb:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1/wp-includes/images/blank.gif >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  restorecli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    user: '33:33'
    environment: *restore-environment
    volumes:
      - restore_content:/var/www/html
    depends_on:
      restoreapp:
        condition: service_healthy
volumes:
  restore_database:
  restore_content:
