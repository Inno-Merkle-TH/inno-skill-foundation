name: qe-foundation-commerce
services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: commerce
      MARIADB_USER: commerce
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run bash scripts/init-env.sh first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run bash scripts/init-env.sh first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: commerce
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: commerce
      WORDPRESS_CONFIG_EXTRA: |
        $$qe_origin = isset($$_SERVER['HTTP_X_QE_LOCAL_ADMIN']) && $$_SERVER['HTTP_X_QE_LOCAL_ADMIN'] === '1' ? 'http://localhost:8081' : getenv('QE_PUBLIC_URL');
        define('WP_HOME', $$qe_origin);
        define('WP_SITEURL', $$qe_origin);
        if (str_starts_with($$qe_origin, 'https://')) {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('DISALLOW_FILE_EDIT', true);
      QE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1/wp-includes/images/blank.gif >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    ports:
      - 127.0.0.1:8080:80
      - 127.0.0.1:8081:81
    depends_on:
      wordpress:
        condition: service_healthy
  eventdb:
    image: mariadb:11.4.8
    profiles: [tracking]
    environment:
      MARIADB_DATABASE: lab
      MARIADB_USER: collector
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - events:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  qe-api:
    build:
      context: ../qe-code
    profiles: [tracking]
    working_dir: /app
    command: [npm, start]
    environment:
      DB_HOST: eventdb
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      eventdb:
        condition: service_healthy
  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    user: '33:33'
    profiles: [tools]
    environment:
      <<: *wordpress-environment
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Run bash scripts/init-env.sh first}
    volumes:
      - wordpress:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
volumes:
  database:
  wordpress:
  events:
