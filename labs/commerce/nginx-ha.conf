upstream storefront {
    zone storefront 64k;
    resolver 127.0.0.11 valid=5s;
    server wordpress:80 resolve max_fails=1 fail_timeout=3s;
    server wordpress-b:80 resolve max_fails=1 fail_timeout=3s;
}
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s;
    add_header X-QE-Lab-Backend $upstream_addr always;
    location ~* ^/(wp-admin(?:/|$)|wp-login\.php|xmlrpc\.php|wp-json/wp/v2/users) { return 403; }
    location = /lab-events {
        set $api http://qe-api:3000;
        proxy_pass $api;
        client_max_body_size 64k;
    }
    location /lab-api/ {
        set $api http://qe-api:3000;
        proxy_pass $api;
    }
    location / {
        if ($arg_rest_route != '') { return 403; }
        proxy_pass http://storefront;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $http_host;
        proxy_set_header X-QE-Local-Admin '';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 81;
    server_name _;
    location / {
        proxy_pass http://storefront;
        proxy_set_header Host $http_host;
        proxy_set_header X-QE-Local-Admin '1';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
