name: QE foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/qe-code
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: labs/qe-code/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node --test ../commerce/tests/snapshot-integrity.test.mjs
